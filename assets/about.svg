<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="650" height="300" viewBox="0 0 650 300">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
  </defs>
  
  <!-- Terminal Window -->
  <rect x="0" y="0" width="650" height="300" rx="12" ry="12" fill="url(#termBg)" stroke="#e94560" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Terminal Title Bar -->
  <rect x="0" y="0" width="650" height="36" rx="12" ry="12" fill="#0d0d1a"/>
  <rect x="0" y="24" width="650" height="12" fill="#0d0d1a"/>
  <line x1="0" y1="36" x2="650" y2="36" stroke="#e94560" stroke-opacity="0.2" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Terminal Title -->
  <text x="325" y="23" text-anchor="middle" font-family="'SF Mono', 'Consolas', monospace" font-size="12" fill="#e94560" font-weight="600">
    gowtham@dev — zsh
  </text>
  
  <!-- Terminal Content -->
  <g font-family="'SF Mono', 'JetBrains Mono', 'Consolas', monospace" font-size="13">
    <!-- Command 1 -->
    <text x="20" y="65" fill="#e94560" font-weight="bold">❯</text>
    <text x="40" y="65" fill="#e2e8f0">cat profile.json</text>
    
    <!-- JSON Output -->
    <text x="20" y="95" fill="#e94560">{</text>
    
    <text x="35" y="120" fill="#e94560">"name"</text>
    <text x="90" y="120" fill="#64748b">:</text>
    <text x="100" y="120" fill="#f8fafc">"Gowtham Dakinedi"</text>
    <text x="245" y="120" fill="#64748b">,</text>
    
    <text x="35" y="145" fill="#e94560">"course"</text>
    <text x="105" y="145" fill="#64748b">:</text>
    <text x="115" y="145" fill="#f8fafc">"B.Tech Data Science Student"</text>
    <text x="345" y="145" fill="#64748b">,</text>
    
    <text x="35" y="170" fill="#e94560">"passion"</text>
    <text x="115" y="170" fill="#64748b">:</text>
    <text x="125" y="170" fill="#f8fafc">"Full Stack Development &amp; Systems"</text>
    <text x="410" y="170" fill="#64748b">,</text>
    
    <text x="35" y="195" fill="#e94560">"learning"</text>
    <text x="120" y="195" fill="#64748b">:</text>
    <text x="130" y="195" fill="#f8fafc">"Spring Boot &amp; AI Technologies"</text>
    <text x="375" y="195" fill="#64748b">,</text>
    
    <text x="35" y="220" fill="#e94560">"mission"</text>
    <text x="115" y="220" fill="#64748b">:</text>
    <text x="125" y="220" fill="#f8fafc">"Always Learning, Evolving &amp; Building"</text>
    
    <text x="20" y="245" fill="#e94560">}</text>
    
    <!-- New Command Line -->
    <text x="20" y="275" fill="#e94560" font-weight="bold">❯</text>
    <rect x="40" y="263" width="10" height="16" fill="#e94560">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
